ida_telemetry_logger:
  ros__parameters:
    log_dir: "./logs"
    log_hz: 1.0
    # Hakem kanıtı güç kesintisinde ve status node'unda hemen görünür olmalı.
    flush_every_lines: 1

ida_video_logger:
  ros__parameters:
    log_dir: "./logs"
    log_hz: 1.0
    fps: 15.0
    fourcc: "mp4v"
    segment_duration_s: 10.0
    frame_stall_timeout_s: 2.0
    frame_width: -1
    frame_height: -1
    record_path: ""
    processed_image_topic: "/perception/processed_image/p1p2"

ida_map_logger:
  ros__parameters:
    log_dir: "./logs"
    # map.mp4: gerçek zamanlı, okunabilir ve kamera videosundan bağımsız.
    log_hz: 5.0
    segment_duration_s: 10.0
    flush_every_lines: 1
